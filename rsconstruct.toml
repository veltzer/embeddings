
# rsconstruct build configuration for this repository.
#
# This builds and checks the code only. The pipeline itself (scripts/run.py:
# gigabytes of Wikipedia, an hour of training) is run by hand and its result
# published as a GitHub release; see README.md.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

[analyzer.python]

[processor.checker.ruff]
src_dirs = ["demos", "scripts", "tests"]

[processor.checker.pyrefly]
src_dirs = ["demos", "scripts", "tests"]

[processor.checker.pytest]
src_dirs = ["tests"]
# Everything the tests import, so an edit to any of it re-runs the suite on
# a warm cache.
dep_inputs = [
    "scripts/align.py",
    "scripts/common.py",
    "scripts/extract.py",
]

# ─── the browser demo ────────────────────────────────────────────────────────

# CI uploads this directory as the Pages artifact: the demo page and the
# tables it searches, built from the release [web] in embeddings.toml pins.
[pages]
dir = "out/web"

# Downloads the pinned release (three 160 MB tables) whenever an input
# changes; otherwise the site is restored from the cache.
[processor.explicit.generic.web]
command = "demos/web/make_tables.py"
inputs = [
    "embeddings.toml",
    "demos/web/make_tables.py",
    "demos/web/index.html",
    "demos/web/demo.js",
    "demos/web/demo.css",
    "demos/vectors.py",
    "scripts/common.py",
]
output_dirs = ["out/web"]

[processor.checker.oxlint]
src_dirs = ["demos/web"]
args = ["-c", ".oxlintrc.json"]

[processor.checker.itidy]
src_dirs = ["demos/web"]

# Only .css is passed: .biome.jsonc turns biome's JavaScript and JSON linters
# off, oxlint covers JavaScript.
[processor.checker.biome]
src_dirs = ["demos/web"]
src_extensions = [".css"]

# ─── toml / yaml ─────────────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "embeddings.toml", "pyproject.toml", "rsconstruct.toml"]

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

[processor.checker.iyamllint]
src_dirs = [".github"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]
